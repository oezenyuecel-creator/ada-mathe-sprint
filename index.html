<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ada's Mathe-Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-alt:#f2ecdd;
    --surface:#ffffff;
    --ink:#2b4570;
    --ink-strong:#1c2f4d;
    --ink-soft:#5a7290;
    --grid-line:rgba(43,69,112,0.09);
    --border:rgba(43,69,112,0.16);
    --good:#2f7d5d;
    --good-bg:#e3f2ea;
    --warn:#c98a2c;
    --warn-bg:#faf0dd;
    --bad:#c0392b;
    --bad-bg:#fbe8e5;
    --gold:#b8860f;
    --gold-bg:#faf1d9;
    --shadow: 0 1px 2px rgba(43,69,112,0.06), 0 6px 20px rgba(43,69,112,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141d29;
      --paper-alt:#101720;
      --surface:#1c2838;
      --ink:#8fb0e6;
      --ink-strong:#eaf1fb;
      --ink-soft:#9fb2c9;
      --grid-line:rgba(143,176,230,0.08);
      --border:rgba(143,176,230,0.2);
      --good:#5fbf93;
      --good-bg:#173226;
      --warn:#e0ab53;
      --warn-bg:#3a2c12;
      --bad:#ea7a6c;
      --bad-bg:#3a1c18;
      --gold:#e3c05a;
      --gold-bg:#332711;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141d29;
    --paper-alt:#101720;
    --surface:#1c2838;
    --ink:#8fb0e6;
    --ink-strong:#eaf1fb;
    --ink-soft:#9fb2c9;
    --grid-line:rgba(143,176,230,0.08);
    --border:rgba(143,176,230,0.2);
    --good:#5fbf93;
    --good-bg:#173226;
    --warn:#e0ab53;
    --warn-bg:#3a2c12;
    --bad:#ea7a6c;
    --bad-bg:#3a1c18;
    --gold:#e3c05a;
    --gold-bg:#332711;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 28px),
      var(--paper);
    color:var(--ink-strong);
    font-family:'Lexend', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:18px 16px 48px; }
  .hand{ font-family:'Caveat', cursive; }
  .mono{ font-family:'Space Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  header.top{ padding:6px 2px 18px; }
  header.top h1{ margin:0 0 2px; font-size:1.5rem; font-weight:700; color:var(--ink-strong); text-wrap:balance; }
  header.top .sub{ color:var(--ink-soft); font-size:0.92rem; }
  .countdown{
    margin-top:12px; display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:10px 14px; box-shadow:var(--shadow);
  }
  .countdown .num{ font-family:'Space Mono',monospace; font-size:1.6rem; font-weight:700; color:var(--ink); }
  .countdown .txt{ color:var(--ink-soft); font-size:0.86rem; line-height:1.25; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .banner{
    display:flex; align-items:center; gap:10px;
    background:var(--ink); color:#fff; padding:9px 14px;
  }
  .badge{
    flex:none; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.82rem;
  }
  .banner .name{ font-weight:600; font-size:0.98rem; }
  .banner .icon{ margin-left:auto; font-size:1.15rem; }

  .hero{ margin-bottom:16px; cursor:pointer; transition:transform .12s ease; }
  .hero:active{ transform:scale(0.985); }
  .hero .banner{ background:linear-gradient(135deg, var(--ink), var(--ink-strong)); }
  .hero .body{ padding:14px 16px 16px; }
  .hero .body p{ margin:0 0 12px; color:var(--ink-soft); font-size:0.92rem; }
  .hero .cta{
    display:inline-flex; align-items:center; gap:8px; background:var(--gold); color:#2a2003;
    font-weight:700; padding:10px 16px; border-radius:999px; font-size:0.95rem;
  }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile{ cursor:pointer; transition:transform .12s ease; }
  .tile:active{ transform:scale(0.97); }
  .tile .body{ padding:10px 12px 12px; min-height:44px; }
  .tile .body .ex{ font-size:0.78rem; color:var(--ink-soft); line-height:1.3; }
  .pill{
    display:inline-block; margin-top:8px; font-size:0.72rem; font-weight:600; padding:3px 9px;
    border-radius:999px; letter-spacing:0.02em;
  }
  .pill.new{ background:var(--paper-alt); color:var(--ink-soft); }
  .pill.warn{ background:var(--warn-bg); color:var(--warn); }
  .pill.good{ background:var(--good-bg); color:var(--good); }

  .wide{ grid-column:1 / -1; }

  .section-label{
    font-size:0.72rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft); margin:22px 2px 10px;
  }

  /* Practice / exam view */
  .practice-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .back{ background:none; border:none; color:var(--ink-soft); font-family:'Lexend'; font-size:0.9rem; cursor:pointer; padding:6px 0; }
  .progress{ font-family:'Space Mono',monospace; font-size:0.82rem; color:var(--ink-soft); }
  .track{ height:6px; border-radius:99px; background:var(--paper-alt); overflow:hidden; margin-bottom:18px; }
  .track > div{ height:100%; background:var(--gold); transition:width .25s ease; }

  .stage{ padding:26px 20px 22px; text-align:center; }
  .stage .cat{ font-size:0.78rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
  .stage .prompt-eq{ font-family:'Space Mono',monospace; font-size:1.85rem; font-weight:700; color:var(--ink-strong); line-height:1.35; }
  .stage .prompt-text{ font-family:'Lexend'; font-size:1.08rem; font-weight:500; color:var(--ink-strong); line-height:1.5; text-wrap:balance; }

  .answer-row{ display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
  input.ans{
    width:120px; text-align:center; font-family:'Space Mono',monospace; font-size:1.3rem;
    padding:10px 8px; border-radius:10px; border:2px solid var(--border); background:var(--paper-alt);
    color:var(--ink-strong);
  }
  input.ans:focus{ outline:none; border-color:var(--ink); }
  .ans-label{ font-size:0.72rem; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .choice-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
  .choice-btn{
    padding:12px 18px; border-radius:12px; border:2px solid var(--border); background:var(--surface);
    color:var(--ink-strong); font-family:'Lexend'; font-weight:600; font-size:0.98rem; cursor:pointer;
  }
  .choice-btn.selected{ border-color:var(--ink); background:var(--paper-alt); }

  /* Zahlenmauer */
  .pyramid{ display:flex; flex-direction:column; align-items:center; gap:8px; margin:18px 0 6px; }
  .pyramid-row{ display:flex; gap:8px; }
  .brick{ width:56px; height:56px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-weight:700; font-size:1.05rem; }
  .brick.known{ background:var(--paper-alt); color:var(--ink-strong); border:2px solid var(--border); }
  .brick input{ width:100%; height:100%; border-radius:10px; border:2px solid var(--border); background:var(--surface); text-align:center; font-family:'Space Mono',monospace; font-weight:700; font-size:1.05rem; color:var(--ink-strong); }
  .brick input:focus{ outline:none; border-color:var(--ink); }

  /* Malhaus */
  .malhaus-roof{ width:112px; height:64px; margin:16px auto 0; background:var(--ink); clip-path:polygon(50% 0%,0% 100%,100% 100%); display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; }
  .malhaus-roof span{ color:#fff; font-family:'Space Mono',monospace; font-weight:700; font-size:1.1rem; }
  .malhaus-table{ width:180px; margin:0 auto; border:2px solid var(--border); border-top:none; border-radius:0 0 12px 12px; overflow:hidden; }
  .malhaus-row{ display:flex; }
  .malhaus-row + .malhaus-row{ border-top:1px solid var(--border); }
  .malhaus-cell{ flex:1; padding:9px 4px; text-align:center; font-family:'Space Mono',monospace; font-weight:700; font-size:1rem; display:flex; align-items:center; justify-content:center; }
  .malhaus-cell.factor{ background:var(--paper-alt); border-right:1px solid var(--border); color:var(--ink-strong); }
  .malhaus-cell input{ width:100%; border:none; background:transparent; text-align:center; font-family:'Space Mono',monospace; font-weight:700; font-size:1rem; color:var(--ink-strong); }
  .malhaus-cell input:focus{ outline:none; background:var(--paper-alt); }

  .extra-note{ font-size:0.78rem; color:var(--ink-soft); margin:-4px 2px 14px; }

  .submit-btn{
    margin-top:20px; width:100%; padding:13px; border:none; border-radius:12px;
    background:var(--ink); color:#fff; font-family:'Lexend'; font-weight:700; font-size:1rem; cursor:pointer;
  }
  .submit-btn:disabled{ opacity:0.45; }

  .feedback{ padding:0 20px 22px; }
  .stamp{ font-family:'Caveat',cursive; font-size:2rem; font-weight:700; text-align:center; margin-bottom:6px; }
  .stamp.ok{ color:var(--good); }
  .stamp.no{ color:var(--bad); }
  .steps{ background:var(--paper-alt); border-radius:12px; padding:12px 14px; margin-top:10px; }
  .steps div{ font-size:0.92rem; color:var(--ink-strong); padding:3px 0; }
  .steps div.final{ font-weight:700; color:var(--ink); }
  .next-btn{
    margin-top:16px; width:100%; padding:13px; border:none; border-radius:12px;
    background:var(--gold); color:#2a2003; font-family:'Lexend'; font-weight:700; font-size:1rem; cursor:pointer;
  }

  .stat-row{ display:flex; justify-content:space-between; gap:14px; margin:14px 20px 0; font-size:0.82rem; color:var(--ink-soft); }
  .stat-row b{ color:var(--ink-strong); }

  /* summary */
  .score-table{ width:100%; border-collapse:collapse; margin-top:4px; }
  .score-table td{ padding:9px 6px; border-bottom:1px solid var(--border); font-size:0.92rem; }
  .score-table td:last-child{ text-align:right; font-family:'Space Mono',monospace; font-weight:700; }
  .score-table tr:last-child td{ border-bottom:none; }

  .reference dt{ font-weight:700; color:var(--ink); margin-top:14px; }
  .reference dd{ margin:4px 0 0; color:var(--ink-strong); font-size:0.92rem; line-height:1.5; }
  .reference .ex{ font-family:'Space Mono',monospace; font-size:0.86rem; color:var(--ink-soft); margin-top:2px; }

  .def-grid{ display:grid; gap:10px; margin-top:10px; }
  .def-grid .def{ display:flex; align-items:baseline; gap:8px; font-size:0.9rem; }
  .def-grid .term{ flex:none; width:64px; font-weight:700; color:var(--ink); }
  .shape-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:14px; }
  .shape-card{ background:var(--paper-alt); border-radius:12px; padding:10px 6px 12px; text-align:center; }
  .shape-card .icon-wrap{ color:var(--ink); display:flex; justify-content:center; margin-bottom:4px; }
  .shape-card .sname{ font-weight:700; font-size:0.86rem; color:var(--ink-strong); }
  .shape-card .snums{ font-family:'Space Mono',monospace; font-size:0.72rem; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .shape-card .snums b{ color:var(--ink-strong); }

  .link-card{ display:flex; align-items:center; gap:12px; padding:14px 16px; text-decoration:none; color:inherit; }
  .link-card .emoji{ font-size:1.8rem; }
  .link-card .t{ font-weight:600; }
  .link-card .d{ font-size:0.82rem; color:var(--ink-soft); }
  .link-card .go{ margin-left:auto; color:var(--ink-soft); }

  ::selection{ background:var(--gold-bg); }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
// ---- Aufgaben-Engine (inline statt als ES-Modul: läuft dadurch überall zuverlässig,
// auch dort wo module-Skripte/relative Imports von Zusatzdateien blockiert werden) ----
// Gleiche Logik wie engine.js — bei Änderungen an einer Datei die andere mitziehen,
// test-engine.mjs prüft weiterhin engine.js separat.
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CATEGORY_META = {
  addsub:    { label: "Plus & Minus bis 100", icon: "➕", short: "Plus/Minus" },
  muldiv:    { label: "Mal & Geteilt bis 100", icon: "✖️", short: "Mal/Geteilt" },
  fachbegriff: { label: "Fachbegriffe", icon: "🏷️", short: "Fachbegriffe" },
  punktstrich: { label: "Punkt vor Strich", icon: "⚙️", short: "Punkt/Strich" },
  divrest:   { label: "Geteilt mit Rest", icon: "🔟", short: "Rest" },
  gleichung: { label: "Gleichungen & Ungleichungen", icon: "🔍", short: "Gleichungen" },
  sachaufgabe: { label: "Sachaufgaben", icon: "📖", short: "Sachaufgaben" },
  zahlenmauer: { label: "Zahlenmauern", icon: "🧱", short: "Zahlenmauern" },
  malhaus: { label: "Malhäuser", icon: "🏠", short: "Malhäuser" },
};

let uid = 1;
function task(category, prompt, answer, explain, extra) {
  return { id: uid++, category, prompt, answer, explain, ...extra };
}

// ---------- 1. Plus & Minus bis 100 ----------
function genAddSub(opts = {}) {
  const forceBorrow = !!opts.forceBorrow;
  const op = opts.op || pick(["add", "sub"]);
  if (op === "add") {
    let a, b;
    do {
      a = randInt(14, 89);
      b = randInt(9, 89);
    } while (a + b > 100 || a + b < 10);
    const answer = a + b;
    return task("addsub", `${a} + ${b} = ?`, answer, [
      `${a} + ${b}`,
      `Ergebnis (Summe): ${answer}`,
    ]);
  } else {
    let a, b;
    do {
      a = randInt(20, 99);
      b = randInt(9, a);
      if (forceBorrow) {
        // Einerstelle von a kleiner als von b erzwingt einen Zehnerübergang
        if (a % 10 >= b % 10) continue;
      }
    } while (a - b < 0 || a === b && randInt(0,1)===0 && false);
    const answer = a - b;
    const borrow = a % 10 < b % 10;
    return task("addsub", `${a} - ${b} = ?`, answer, [
      borrow
        ? `Bei ${a} reicht die Einerstelle nicht: 1 Zehner wird zu 10 Einern getauscht.`
        : `${a} - ${b}`,
      `Ergebnis (Differenz): ${answer}`,
    ]);
  }
}

// ---------- 2. Mal & Geteilt bis 100 (Einmaleins 1-10) ----------
function genMulDiv(opts = {}) {
  const mode = opts.mode || pick(["mul", "div"]);
  if (mode === "mul") {
    const a = randInt(2, 10), b = randInt(2, 10);
    const answer = a * b;
    return task("muldiv", `${a} · ${b} = ?`, answer, [`${a} · ${b} = ${answer}`]);
  } else {
    const b = randInt(2, 10), q = randInt(2, 10);
    const a = b * q;
    return task("muldiv", `${a} : ${b} = ?`, q, [`${a} : ${b} = ${q}`]);
  }
}

// ---------- 3. Fachbegriffe (Summe/Differenz/Produkt/Quotient) ----------
const TERM = { add: "Summe", sub: "Differenz", mul: "Produkt", div: "Quotient" };
const SYMB = { add: "+", sub: "-", mul: "·", div: ":" };

function makeOperands(op) {
  if (op === "add") { const a = randInt(11, 79), b = randInt(9, 79); return [a, b, a + b]; }
  if (op === "sub") { const a = randInt(20, 99), b = randInt(9, a); return [a, b, a - b]; }
  if (op === "mul") { const a = randInt(2, 10), b = randInt(2, 10); return [a, b, a * b]; }
  const b = randInt(2, 10), q = randInt(2, 10); return [b * q, b, q];
}

function genFachbegriff(opts = {}) {
  const op = opts.op || pick(["add", "sub", "mul", "div"]);
  const [a, b, val] = makeOperands(op);
  const mode = opts.mode || pick(["compute", "name"]);
  const word = TERM[op];
  if (mode === "compute") {
    const templates = {
      add: [`Berechne die Summe aus ${a} und ${b}.`, `Addiere ${a} und ${b}.`],
      sub: [`Berechne die Differenz aus ${a} und ${b}.`, `Subtrahiere ${b} von ${a}.`],
      mul: [`Multipliziere ${a} und ${b}. Wie heißt das Produkt?`, `Bilde das Produkt aus ${a} und ${b}.`],
      div: [`Dividiere ${a} durch ${b}. Wie heißt der Quotient?`],
    };
    return task("fachbegriff", pick(templates[op]), val, [
      `${a} ${SYMB[op]} ${b} = ${val}`,
      `Das Ergebnis von "${word.toLowerCase()==='summe'?'plus':word}" heißt ${word}.`,
    ], { inputType: "number" });
  } else {
    const options = shuffle(["Summe", "Differenz", "Produkt", "Quotient"]);
    return task(
      "fachbegriff",
      `${a} ${SYMB[op]} ${b} = ${val}. Wie heißt das Ergebnis dieser Aufgabe?`,
      word,
      [`${a} ${SYMB[op]} ${b} ist eine ${op === "add" ? "Plus" : op === "sub" ? "Minus" : op === "mul" ? "Mal" : "Geteilt"}-Aufgabe.`, `Das Ergebnis heißt ${word}.`],
      { inputType: "choice", options }
    );
  }
}

// ---------- 4. Punkt vor Strich ----------
function genPunktStrich(opts = {}) {
  const kind = opts.kind || (Math.random() < 0.6 ? "wordchain" : "equation");
  if (kind === "equation") {
    const patterns = ["a+b*c", "a-b*c", "a+b:c", "a-b:c"];
    const p = pick(patterns);
    let a, b, c, answer, text, steps;
    if (p === "a+b*c") {
      b = randInt(2, 9); c = randInt(2, 9); a = randInt(2, 40);
      answer = a + b * c;
      text = `${a} + ${b} · ${c} = ?`;
      steps = [`Punkt zuerst: ${b} · ${c} = ${b * c}`, `Dann Strich: ${a} + ${b * c} = ${answer}`];
    } else if (p === "a-b*c") {
      b = randInt(2, 9); c = randInt(2, 9);
      a = randInt(b * c, b * c + 40);
      answer = a - b * c;
      text = `${a} - ${b} · ${c} = ?`;
      steps = [`Punkt zuerst: ${b} · ${c} = ${b * c}`, `Dann Strich: ${a} - ${b * c} = ${answer}`];
    } else if (p === "a+b:c") {
      c = randInt(2, 9); const q = randInt(2, 9); b = c * q; a = randInt(2, 60);
      answer = a + q;
      text = `${a} + ${b} : ${c} = ?`;
      steps = [`Punkt zuerst: ${b} : ${c} = ${q}`, `Dann Strich: ${a} + ${q} = ${answer}`];
    } else {
      c = randInt(2, 9); const q = randInt(2, 9); b = c * q; a = randInt(q, q + 60);
      answer = a - q;
      text = `${a} - ${b} : ${c} = ?`;
      steps = [`Punkt zuerst: ${b} : ${c} = ${q}`, `Dann Strich: ${a} - ${q} = ${answer}`];
    }
    return task("punktstrich", text, answer, steps);
  }

  // wordchain: genau die Aufgabenform, die auf den Übungsblättern zu Fehlern führte
  const a = randInt(2, 10), b = randInt(2, 10);
  const prod = a * b;
  const templates = [
    () => { const c = randInt(5, 40); return {
      text: `Multipliziere ${a} mit ${b} und addiere ${c}.`,
      answer: prod + c,
      steps: [`1. Schritt (Punkt): ${a} · ${b} = ${prod}`, `2. Schritt (Strich): ${prod} + ${c} = ${prod + c}`],
    }; },
    () => { const c = randInt(5, 40); return {
      text: `Addiere ${c} zu dem Produkt aus ${a} und ${b}.`,
      answer: prod + c,
      steps: [`Zuerst das Produkt bilden: ${a} · ${b} = ${prod}`, `Dann ${c} addieren: ${prod} + ${c} = ${prod + c}`],
    }; },
    () => { const c = randInt(1, Math.max(1, prod - 1)); return {
      text: `Berechne das Produkt aus ${a} und ${b}. Subtrahiere dann ${c}.`,
      answer: prod - c,
      steps: [`Zuerst das Produkt: ${a} · ${b} = ${prod}`, `Dann ${c} subtrahieren: ${prod} - ${c} = ${prod - c}`],
    }; },
    () => { return {
      text: `Bilde das Produkt aus ${a} und ${b} und verdoppele es.`,
      answer: prod * 2,
      steps: [`Zuerst das Produkt: ${a} · ${b} = ${prod}`, `Verdoppeln heißt mal 2: ${prod} · 2 = ${prod * 2}`],
    }; },
    () => {
      let aa = a, bb = b, pp = prod;
      if (pp % 2 !== 0) { bb = bb % 2 === 0 ? bb : bb + 1; pp = aa * bb; }
      return {
        text: `Bilde das Produkt aus ${aa} und ${bb} und halbiere es.`,
        answer: pp / 2,
        steps: [`Zuerst das Produkt: ${aa} · ${bb} = ${pp}`, `Halbieren heißt geteilt durch 2: ${pp} : 2 = ${pp / 2}`],
      };
    },
    () => { const d = randInt(2, 10); const q = randInt(2, 9); const dividend = d * q; const c = randInt(3, 30); return {
      text: `Dividiere ${dividend} durch ${d} und addiere ${c}.`,
      answer: q + c,
      steps: [`Zuerst teilen: ${dividend} : ${d} = ${q}`, `Dann ${c} addieren: ${q} + ${c} = ${q + c}`],
    }; },
  ];
  const r = pick(templates)();
  return task("punktstrich", r.text, r.answer, r.steps);
}

// ---------- 5. Geteilt mit Rest ----------
function genDivRest(opts = {}) {
  const b = randInt(2, 9);
  const q = randInt(1, 11);
  const restZero = Math.random() < 0.15;
  const r = restZero ? 0 : randInt(1, b - 1);
  const a = b * q + r;
  return task(
    "divrest",
    `${a} : ${b} = ? R ?`,
    { quotient: q, rest: r },
    [`${b} passt ${q}-mal in ${a} (${b} · ${q} = ${b * q}).`, `Rest: ${a} - ${b * q} = ${r}`],
    { inputType: "divrest" }
  );
}

// ---------- 6. Gleichungen & Ungleichungen ----------
function genGleichung(opts = {}) {
  const type = opts.type || pick(["add", "sub", "mul", "div"]);
  if (type === "add") {
    const k = randInt(5, 50), x = randInt(5, 49);
    const sum = x + k;
    return task("gleichung", `Addiere ${k} zu einer Zahl. Die Summe ist ${sum}. Wie heißt die Zahl?`, x, [
      `Zahl + ${k} = ${sum}`, `Zahl = ${sum} - ${k} = ${x}`,
    ], { inputType: "number" });
  }
  if (type === "sub") {
    const k = randInt(5, 40), d = randInt(5, 55);
    const x = d + k;
    return task("gleichung", `Subtrahiere ${k} von einer Zahl. Die Differenz ist ${d}. Wie heißt die Zahl?`, x, [
      `Zahl - ${k} = ${d}`, `Zahl = ${d} + ${k} = ${x}`,
    ], { inputType: "number" });
  }
  if (type === "mul") {
    const k = randInt(2, 9), x = randInt(2, 11);
    const p = x * k;
    return task("gleichung", `Multipliziere eine Zahl mit ${k}. Das Produkt ist ${p}. Wie heißt die Zahl?`, x, [
      `Zahl · ${k} = ${p}`, `Zahl = ${p} : ${k} = ${x}`,
    ], { inputType: "number" });
  }
  const k = randInt(2, 9), x = randInt(2, 11);
  const dnd = x * k;
  return task("gleichung", `Teile eine Zahl durch ${k}. Der Quotient ist ${x}. Wie heißt die Zahl?`, dnd, [
    `Zahl : ${k} = ${x}`, `Zahl = ${x} · ${k} = ${dnd}`,
  ], { inputType: "number" });
}

function genUngleichung() {
  function expr() {
    const kind = pick(["mul", "div", "addsmall"]);
    if (kind === "mul") { const a = randInt(2, 10), b = randInt(2, 10); return { text: `${a} · ${b}`, val: a * b }; }
    if (kind === "div") { const b = randInt(2, 9), q = randInt(2, 10); return { text: `${b * q} : ${b}`, val: q }; }
    const a = randInt(10, 80), b = randInt(2, 19); return { text: `${a} + ${b}`, val: a + b };
  }
  let left = expr(), right = expr(), tries = 0;
  while (left.val === right.val && tries++ < 5) right = expr();
  const symbol = left.val < right.val ? "<" : left.val > right.val ? ">" : "=";
  return task("gleichung", `${left.text}  ___  ${right.text}`, symbol, [
    `${left.text} = ${left.val}`, `${right.text} = ${right.val}`, `${left.val} ${symbol} ${right.val}`,
  ], { inputType: "choice", options: ["<", ">", "="] });
}

// ---------- Zusatz: Zahlenmauer (nicht Teil der Prüfungssimulation) ----------
function genZahlenmauer(opts = {}) {
  let b1, b2, b3, m1, m2, top;
  do {
    b2 = randInt(4, 26);
    b1 = randInt(4, 35);
    b3 = randInt(4, 35);
    m1 = b1 + b2;
    m2 = b2 + b3;
    top = m1 + m2;
  } while (top > 100 || top < 30 || m1 > 99 || m2 > 99);

  const side = opts.side || pick(["left", "right"]);
  const cells = { top, midLeft: m1, midRight: m2, botLeft: b1, botMid: b2, botRight: b3 };
  const knownKeys = side === "right" ? ["top", "midRight", "botRight"] : ["top", "midLeft", "botLeft"];
  const unknownKeys = side === "right" ? ["botMid", "midLeft", "botLeft"] : ["botMid", "midRight", "botRight"];
  const steps = side === "right"
    ? [
        `Unten Mitte: ${m2} - ${b3} = ${b2}`,
        `Mitte links: ${top} - ${m2} = ${m1}`,
        `Unten links: ${m1} - ${b2} = ${b1}`,
      ]
    : [
        `Unten Mitte: ${m1} - ${b1} = ${b2}`,
        `Mitte rechts: ${top} - ${m1} = ${m2}`,
        `Unten rechts: ${m2} - ${b2} = ${b3}`,
      ];
  const answer = {}; unknownKeys.forEach(k => { answer[k] = cells[k]; });
  return task("zahlenmauer", "Fülle die Zahlenmauer aus.", answer, steps, {
    inputType: "pyramid", cells, knownKeys, unknownKeys,
  });
}

// ---------- Zusatz: Malhaus (nicht Teil der Prüfungssimulation) ----------
function genMalhaus() {
  const m = randInt(2, 10);
  const pool = shuffle([2, 3, 4, 5, 6, 7, 8, 9, 10]);
  const factors = pool.slice(0, 4).sort((a, b) => a - b);
  const products = factors.map(f => f * m);
  const steps = factors.map((f, i) => `${f} · ${m} = ${products[i]}`);
  return task("malhaus", `Fülle das Malhaus aus.`, products, steps, {
    inputType: "malhaus", m, factors,
  });
}

// ---------- 7. Sachaufgaben ----------
const NAMES = ["Lena", "Finn", "Mia", "Leon", "Emma", "Noah", "Ada", "Paul"];
const SACHAUFGABEN = [
  // Drei-Summanden — genau die Stelle, an der oft ein Summand vergessen wird
  () => {
    const items = pick([
      ["Zimtschnecken", "Nussecken", "Salzbrezel", "Bäcker"],
      ["rote Äpfel", "grüne Äpfel", "gelbe Äpfel", "Marktfrau"],
      ["Fußbälle", "Basketbälle", "Tennisbälle", "Sportlehrer"],
    ]);
    const a = randInt(12, 35), b = randInt(8, 25), c = randInt(5, 20);
    const answer = a + b + c;
    return {
      text: `${items[3]} X hat ${a} ${items[0]}, ${b} ${items[1]} und ${c} ${items[2]} gebacken bzw. sortiert. Wie viele sind es insgesamt?`,
      answer,
      antwortsatz: `Es sind insgesamt ${answer} ${items[0]}.`,
      steps: [`${a} + ${b} + ${c}`, `Wichtig: alle drei Zahlen zählen! = ${answer}`],
    };
  },
  // Subtraktions-Kette
  () => {
    const total = randInt(50, 90);
    const s1 = randInt(15, 35), s2 = randInt(1, 5);
    const answer = total - s1 - s2;
    const name = pick(NAMES);
    return {
      text: `In einem Regal stehen ${total} Bücher. In einer Woche werden ${s1} Bücher verkauft. ${name} nimmt noch ${s2} für sich mit. Wie viele Bücher bleiben im Regal?`,
      answer,
      antwortsatz: `Es sind noch ${answer} Bücher im Regal.`,
      steps: [`${total} - ${s1} = ${total - s1}`, `${total - s1} - ${s2} = ${answer}`],
    };
  },
  // Vergleich mit Zielgröße — genau der zweite, oft vergessene Schritt
  () => {
    const baked = randInt(24, 40);
    const gone1 = randInt(2, 5), gone2 = randInt(1, 4);
    const left = baked - gone1 - gone2;
    const klasse = randInt(left - 6, left + 6 > 0 ? left + 6 : left + 3);
    const klasseSafe = Math.max(10, Math.min(klasse, left + 8));
    const diff = left - klasseSafe;
    const genug = diff >= 0;
    return {
      text: `Eine Oma backt ${baked} Muffins. Vor der Schule nascht das Geburtstagskind ${gone1} und verschenkt ${gone2}. In der Klasse sind ${klasseSafe} Kinder. Reichen die Muffins für die ganze Klasse? Wie viele bleiben übrig oder fehlen?`,
      answer: diff,
      antwortsatz: genug
        ? `Ja, es reicht. Es bleiben noch ${diff} Muffins übrig.`
        : `Nein, es reicht nicht. Es fehlen ${-diff} Muffins.`,
      steps: [`${baked} - ${gone1} - ${gone2} = ${left}`, `${left} - ${klasseSafe} (Kinder) = ${diff}`, genug ? "Zahl ≥ 0 → es reicht, Rest bleibt übrig" : "Zahl < 0 → es reicht nicht, so viele fehlen"],
    };
  },
  // Multiplikation im Sachkontext
  () => {
    const tier = pick([["Spinnen", 8], ["Hunde", 4], ["Hühner", 2], ["Dreiräder", 3]]);
    const n = randInt(3, 9);
    const answer = tier[1] * n;
    return {
      text: `Ein/e ${tier[0].slice(0, -1)} hat ${tier[1]} Beine bzw. Räder. Auf dem Hof gibt es ${n} davon. Wie viele Beine/Räder sind das insgesamt?`,
      answer,
      antwortsatz: `Das sind insgesamt ${answer}.`,
      steps: [`${tier[1]} · ${n} = ${answer}`],
    };
  },
  // Division mit Rest im Sachkontext
  () => {
    const b = randInt(3, 8);
    const q = randInt(4, 10);
    const r = randInt(1, b - 1);
    const total = b * q + r;
    const name = pick(NAMES);
    return {
      text: `${name} hat ${total} Gummibärchen und teilt sie gerecht an ${b} Kinder auf. Wie viele bekommt jedes Kind, und wie viele bleiben übrig?`,
      answer: q,
      rest: r,
      antwortsatz: `Jedes Kind bekommt ${q} Gummibärchen, ${r} bleiben übrig.`,
      steps: [`${total} : ${b} = ${q} Rest ${r}`],
      inputType: "divrest",
    };
  },
];

function genSachaufgabe() {
  const r = pick(SACHAUFGABEN)();
  return task("sachaufgabe", r.text, r.rest !== undefined ? { quotient: r.answer, rest: r.rest } : r.answer, [
    ...r.steps,
    `Antwortsatz: ${r.antwortsatz}`,
  ], { inputType: r.inputType || "number", antwortsatz: r.antwortsatz });
}

// ---------- Dispatcher ----------
function generateTask(category) {
  switch (category) {
    case "addsub": return genAddSub();
    case "muldiv": return genMulDiv();
    case "fachbegriff": return genFachbegriff();
    case "punktstrich": return genPunktStrich();
    case "divrest": return genDivRest();
    case "gleichung": return Math.random() < 0.4 ? genUngleichung() : genGleichung();
    case "sachaufgabe": return genSachaufgabe();
    case "zahlenmauer": return genZahlenmauer();
    case "malhaus": return genMalhaus();
    default: throw new Error("unknown category " + category);
  }
}

function checkAnswer(t, userAnswer) {
  if (t.inputType === "divrest") {
    return Number(userAnswer.quotient) === t.answer.quotient && Number(userAnswer.rest) === t.answer.rest;
  }
  if (t.inputType === "pyramid") {
    return t.unknownKeys.every(k => Number(userAnswer[k]) === t.answer[k]);
  }
  if (t.inputType === "malhaus") {
    return Array.isArray(userAnswer) && userAnswer.length === t.answer.length &&
      userAnswer.every((v, i) => Number(v) === t.answer[i]);
  }
  if (typeof t.answer === "string") {
    return String(userAnswer).trim() === t.answer;
  }
  return Number(userAnswer) === t.answer;
}

function koerperQuiz(){
  const mode = Math.random() < 0.5 ? 'ecken' : 'kanten';
  const k = KOERPER[randInt(0, KOERPER.length-1)];
  const val = mode === 'ecken' ? k.ecken : k.kanten;
  const wrongPool = KOERPER.filter(x => x !== k).map(x => mode==='ecken'?x.ecken:x.kanten);
  const options = Array.from(new Set([val, ...wrongPool])).slice(0,4);
  while(options.length < 4) options.push(val + options.length);
  options.sort(() => Math.random()-0.5);
  return {
    id: Math.random(), category:'koerper',
    prompt: `Wie viele ${mode === 'ecken' ? 'Ecken' : 'Kanten'} hat ein ${k.name}?`,
    answer: String(val),
    explain: [`${k.name}: ${k.note}.`, `${mode === 'ecken' ? 'Ecken' : 'Kanten'}: ${val}`],
    inputType:'choice', options: options.map(String),
  };
}

  const tasks = Array.from({length: catIds.length * 4}, () => {
    const c = catIds[randInt(0, catIds.length-1)];
    return generateTask(c);
  });
  go({ view:'practice', mode:'weak', tasks, idx:0, results:[], answered:false });
}

function renderPractice(){
  const { tasks, idx, mode } = route;
  const t = tasks[idx];
  const meta = CATEGORY_META[t.category] || { label:'Körper', icon:'🧊' };
  const total = tasks.length;

  app.innerHTML = `
    <div class="practice-head">
      <button class="back" id="backBtn">&larr; Zurück</button>
      <div class="progress">${idx+1} / ${total}</div>
    </div>
    <div class="track"><div style="width:${((idx)/total)*100}%"></div></div>
    <div class="card">
      <div class="stage">
        <div class="cat">${meta.icon} ${meta.label}</div>
        <div class="${isEquationPrompt(t) ? 'prompt-eq' : 'prompt-text'}">${t.prompt}</div>
        <div id="answerArea"></div>
      </div>
      <div id="feedbackArea"></div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => go({ view:'home' }));
  renderAnswerArea(t);
}

function isEquationPrompt(t){
  return t.category === 'addsub' || t.category === 'muldiv' || t.category === 'divrest' ||
    (t.category === 'punktstrich' && /^[\d\s+\-·:?]+$/.test(t.prompt)) ||
    (t.category === 'gleichung' && t.inputType === 'choice');
}

function renderAnswerArea(t){
  const area = document.getElementById('answerArea');
  if(t.inputType === 'pyramid'){
    const c = t.cells;
    const cellHtml = (key) => t.knownKeys.includes(key)
      ? `<div class="brick known">${c[key]}</div>`
      : `<div class="brick"><input data-key="${key}" inputmode="numeric" pattern="[0-9]*"></div>`;
    area.innerHTML = `
      <div class="pyramid">
        <div class="pyramid-row">${cellHtml('top')}</div>
        <div class="pyramid-row">${cellHtml('midLeft')}${cellHtml('midRight')}</div>
        <div class="pyramid-row">${cellHtml('botLeft')}${cellHtml('botMid')}${cellHtml('botRight')}</div>
      </div>
      <button class="submit-btn" id="submitBtn">Prüfen</button>
    `;
  } else if(t.inputType === 'malhaus'){
    area.innerHTML = `
      <div class="malhaus-roof"><span>&middot; ${t.m}</span></div>
      <div class="malhaus-table">
        ${t.factors.map((f,i) => `
          <div class="malhaus-row">
            <div class="malhaus-cell factor">${f}</div>
            <div class="malhaus-cell"><input data-idx="${i}" inputmode="numeric" pattern="[0-9]*"></div>
          </div>`).join('')}
      </div>
      <button class="submit-btn" id="submitBtn">Prüfen</button>
    `;
  } else if(t.inputType === 'divrest'){
    area.innerHTML = `
      <div class="answer-row">
        <div><span class="ans-label">Ergebnis</span><input class="ans" id="a1" inputmode="numeric" pattern="[0-9]*"></div>
        <div><span class="ans-label">Rest</span><input class="ans" id="a2" inputmode="numeric" pattern="[0-9]*"></div>
      </div>
      <button class="submit-btn" id="submitBtn">Prüfen</button>
    `;
  } else if(t.inputType === 'choice'){
    area.innerHTML = `<div class="choice-row" id="choiceRow">${t.options.map(o => `<button class="choice-btn" data-v="${o}">${o}</button>`).join('')}</div>
      <button class="submit-btn" id="submitBtn" disabled>Prüfen</button>`;
    let selected = null;
    area.querySelectorAll('.choice-btn').forEach(b => b.addEventListener('click', () => {
      area.querySelectorAll('.choice-btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected'); selected = b.dataset.v;
      document.getElementById('submitBtn').disabled = false;
    }));
    area.dataset.get = 'choice';
    window.__getSelected = () => selected;
  } else {
    area.innerHTML = `
      <div class="answer-row"><input class="ans" id="a1" inputmode="numeric" pattern="[0-9]*" autofocus></div>
      <button class="submit-btn" id="submitBtn">Prüfen</button>
    `;
    const inp = document.getElementById('a1');
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') submitAnswer(t); });
    setTimeout(() => inp.focus(), 50);
  }
  document.getElementById('submitBtn').addEventListener('click', () => submitAnswer(t));
}

function submitAnswer(t){
  let userAnswer;
  if(t.inputType === 'pyramid'){
    userAnswer = {};
    t.unknownKeys.forEach(k => { userAnswer[k] = document.querySelector(`input[data-key="${k}"]`).value; });
  } else if(t.inputType === 'malhaus'){
    userAnswer = t.factors.map((_, i) => document.querySelector(`input[data-idx="${i}"]`).value);
  } else if(t.inputType === 'divrest'){
    userAnswer = { quotient: document.getElementById('a1').value, rest: document.getElementById('a2').value };
  } else if(t.inputType === 'choice'){
    userAnswer = window.__getSelected ? window.__getSelected() : null;
  } else {
    userAnswer = document.getElementById('a1').value;
  }
  const incomplete = userAnswer === null || userAnswer === ''
    || (Array.isArray(userAnswer) && userAnswer.some(v => v === ''))
    || (!Array.isArray(userAnswer) && typeof userAnswer === 'object' && Object.values(userAnswer).some(v => v === ''));
  if(incomplete) return;
  const correct = t.category === 'koerper' ? String(userAnswer) === t.answer : checkAnswer(t, userAnswer);
  route.results.push({ category: t.category, correct });
  if(t.category !== 'koerper') bumpCat(t.category, correct);

  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = `
    <div class="feedback">
      <div class="stamp hand ${correct ? 'ok' : 'no'}">${correct ? '✓ richtig!' : '✗ noch nicht ganz'}</div>
      <div class="steps">
        ${t.explain.map((s,i) => `<div class="${i === t.explain.length-1 ? 'final' : ''}">${s}</div>`).join('')}
      </div>
      <button class="next-btn" id="nextBtn">${route.idx + 1 >= route.tasks.length ? 'Auswertung ansehen' : 'Weiter →'}</button>
    </div>
  `;
  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('#answerArea input, .choice-btn').forEach(el => el.disabled = true);
  document.getElementById('nextBtn').addEventListener('click', () => {
    if(route.idx + 1 >= route.tasks.length){
      go({ view:'summary', mode: route.mode, results: route.results });
    } else {
      route.idx++; route.answered = false; renderPractice();
    }
  });
}

function renderSummary(){
  const { results, mode } = route;
  const byCat = {};
  results.forEach(r => {
    const c = byCat[r.category] || { correct:0, total:0 };
    c.total++; if(r.correct) c.correct++;
    byCat[r.category] = c;
  });
  const totalCorrect = results.filter(r => r.correct).length;
  const totalAll = results.length;
  const pct = Math.round((totalCorrect/totalAll)*100);
  const verdict = pct >= 90 ? 'Stark! Das ist schon 1-mit-Sternchen-Niveau. ⭐'
    : pct >= 75 ? 'Richtig gut! Noch ein bisschen Feinschliff.'
    : pct >= 55 ? 'Solide Basis – ein paar Themen brauchen noch Übung.'
    : 'Guter Start – jetzt gezielt üben, dann klappt es.';
  const weak = Object.entries(byCat).filter(([,v]) => v.correct/v.total < 0.75).map(([k]) => k);

  app.innerHTML = `
    <div class="practice-head"><button class="back" id="backBtn">&larr; Zur Übersicht</button><div></div></div>
    <div class="card">
      <div class="stage">
        <div class="cat">${mode === 'exam' ? 'Prüfungssimulation' : mode === 'weak' ? 'Schwächen-Training' : 'Übungsrunde'} beendet</div>
        <div class="mono" style="font-size:2.4rem;font-weight:700;color:var(--ink);">${totalCorrect}/${totalAll}</div>
        <div class="prompt-text" style="margin-top:6px;">${verdict}</div>
      </div>
      <div style="padding:0 20px 20px;">
        <table class="score-table">
          ${Object.entries(byCat).map(([cat,v]) => `
            <tr><td>${(CATEGORY_META[cat]||{icon:'🧊',label:'Körper'}).icon} ${(CATEGORY_META[cat]||{label:'Körper'}).label}</td>
            <td style="color:${v.correct/v.total >= 0.75 ? 'var(--good)' : 'var(--warn)'}">${v.correct}/${v.total}</td></tr>
          `).join('')}
        </table>
      </div>
    </div>
    ${weak.length ? `
    <div class="card" style="margin-top:16px;">
      <div class="banner"><div class="badge">!</div><div class="name">Als Nächstes üben</div><div class="icon">🎯</div></div>
      <div class="body" style="padding:14px 16px;">
        <p style="margin:0 0 12px;color:var(--ink-soft);font-size:0.9rem;">${weak.map(w => (CATEGORY_META[w]||{label:'Körper'}).label).join(', ')} – genau darauf zielt diese Runde.</p>
        <span class="cta" id="weakBtn" style="cursor:pointer;">Schwächen gezielt üben →</span>
      </div>
    </div>` : ''}
    <div class="section-label">&nbsp;</div>
    <div class="grid">
      <div class="card tile wide" id="examAgain"><div class="body" style="text-align:center;padding:16px;font-weight:600;">🔁 Neue Prüfungssimulation</div></div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => go({ view:'home' }));
  document.getElementById('examAgain').addEventListener('click', startExam);
  if(weak.length) document.getElementById('weakBtn').addEventListener('click', () => startWeakDrill(weak));
}

function renderReference(){
  app.innerHTML = `
    <div class="practice-head"><button class="back" id="backBtn">&larr; Zurück</button><div></div></div>
    <div class="card">
      <div class="banner"><div class="badge">10</div><div class="name">Spickzettel</div><div class="icon">📋</div></div>
      <div class="body" style="padding:16px 18px 20px;">
        <dl class="reference">
          <dt>Fachbegriffe</dt>
          <dd>Plus → <b>Summe</b> &nbsp;|&nbsp; Minus → <b>Differenz</b> &nbsp;|&nbsp; Mal → <b>Produkt</b> &nbsp;|&nbsp; Geteilt → <b>Quotient</b></dd>

          <dt>Punkt vor Strich</dt>
          <dd>Erst · und : rechnen, dann + und −. Bei Wortaufgaben wie „Bilde das Produkt … und verdoppele es&rdquo; genauso: erst das Produkt, <b>dann</b> den zweiten Schritt nicht vergessen!</dd>
          <div class="ex">6 + 3 · 8 = 6 + 24 = 30 &nbsp;(nicht 9 · 8!)</div>

          <dt>Verdoppeln &amp; Halbieren</dt>
          <dd>Verdoppeln = <b>· 2</b> (mal 2). Halbieren = <b>: 2</b> (geteilt durch 2).</dd>

          <dt>Geteilt mit Rest</dt>
          <dd>Wie oft passt der Teiler ganz hinein? Was bleibt übrig? Der Rest ist <b>immer kleiner</b> als der Teiler.</dd>
          <div class="ex">43 : 8 → 8 passt 5-mal (40), Rest 3 → 5 R 3</div>

          <dt>Gleichungen (Rückwärts-Rechnen)</dt>
          <dd>„Addiere 30 zur Zahl. Die Summe ist 58.&rdquo; → rückwärts rechnen: 58 − 30 = <b>28</b>.<br>Plus ↔ Minus rückwärts, Mal ↔ Geteilt rückwärts.</dd>

          <dt>Sachaufgaben</dt>
          <dd>1) Zahlen im Text markieren. 2) Rechnung aufschreiben. 3) <b>Alle</b> Zahlen aus der Aufgabe verwenden. 4) Antwortsatz im ganzen Satz.</dd>
        </dl>
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => go({ view:'home' }));
}
